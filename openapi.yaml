openapi: 3.1.0
info:
  title: Draftout Community API
  version: 0.2.0
  description: |
    Community-maintained OpenAPI description for the public Draftout stats
    endpoints observed at draftoutmc.com.

    This is not an official Draftout API specification. It was inferred from
    live responses on 2026-09-14 and may be incomplete.
servers:
  - url: https://draftoutmc.com
    description: Draftout production server
tags:
  - name: Stats
    description: Leaderboards, player stats, match details, and rating history.
  - name: Ranks
    description: Rating rank bands.
paths:
  /api/stats:
    get:
      tags:
        - Stats
      summary: Get the player leaderboard
      description: |
        Returns competitive player statistics ordered by the selected metric.
        Results can be limited, filtered by a case-insensitive username query,
        and scoped to a rating era.
      operationId: getStatsLeaderboard
      parameters:
        - name: metric
          in: query
          description: |
            Statistic used to order the results:

            - `elo`: current rating.
            - `winrate`: wins divided by wins plus losses; draws are excluded.
            - `diff`: average goal differential across completed matches,
              calculated as player goals minus opponent goals.

            Defaults to `elo`.
          required: false
          schema:
            $ref: "#/components/schemas/LeaderboardMetric"
            default: elo
        - name: q
          in: query
          description: Case-insensitive username search query.
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of rows to return. Defaults to `100`.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 100
        - $ref: "#/components/parameters/Era"
      responses:
        "200":
          description: Ranked player statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"
              examples:
                elo:
                  summary: Elo leaderboard
                  value:
                    rows:
                      - uuid: 92b63a39-b36a-445f-a94c-77ae212dcea3
                        username: bing_pigs
                        elo: 1566
                        rd: 102.36122699299446
                        eraId: 2
                        rankName: Evoker III
                        rankColor: "#D7D284"
                        matches: 16
                        completedMatches: 12
                        wins: 14
                        losses: 2
                        draws: 0
                        winRate: 0.875
                        averageFinishTime: 1436573.1
                        averageGoals: 4.333333333333333
                        ranked: true
                        metricValue: 1566
                        rank: 2
                    metric: elo
                    query: ""
                    limit: 100
                    eraId: 2
                    eras:
                      - id: 1
                        firstMatchId: 0
                        season: null
                        system: elo
                      - id: 2
                        firstMatchId: 514840
                        season: null
                        system: glicko2
  /api/ranks:
    get:
      tags:
        - Ranks
      summary: Get rating rank bands
      description: |
        Returns the configured Draftout rating rank bands in ascending order.
        The highest band is open-ended and uses `null` for its maximum.
      operationId: getRanks
      responses:
        "200":
          description: Rank bands.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rank"
              examples:
                ranks:
                  summary: Rank bands
                  value:
                    - name: Silverfish I
                      min: 0
                      max: 99
                      color: "#ACB1B4"
                    - name: Guardian I
                      min: 1800
                      max: 1899
                      color: "#36775F"
                    - name: Warden
                      min: 2000
                      max: null
                      color: "#1CCEDA"
  /api/stats/{username}:
    get:
      tags:
        - Stats
      summary: Get player stats and recent matches
      description: |
        Returns player metadata, aggregate record information, and a paginated
        list of matches for the selected filter. If the player is not found,
        the endpoint still returns HTTP 200 with `player: null` and empty stats.
      operationId: getPlayerStats
      parameters:
        - $ref: "#/components/parameters/Username"
        - name: page
          in: query
          description: One-based page number. Defaults to `1`.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: filter
          in: query
          description: Match queue filter. Defaults to `competitive`.
          required: false
          schema:
            $ref: "#/components/schemas/MatchFilter"
            default: competitive
        - $ref: "#/components/parameters/Era"
      responses:
        "200":
          description: Player stats page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerStatsResponse"
              examples:
                competitive:
                  summary: Competitive stats
                  value:
                    player:
                      uuid: 92b63a39-b36a-445f-a94c-77ae212dcea3
                      username: bing_pigs
                      elo: 1566
                      rd: 102.36122699299446
                      ranked: true
                      rank: 2
                      rankName: Evoker III
                      rankColor: "#D7D284"
                      eraId: 2
                    record:
                      matches: 16
                      completedMatches: 12
                      wins: 14
                      losses: 2
                      draws: 0
                      winRate: 0.875
                      averageFinishTime: 1436573.1
                      averageGoals: 4.333333333333333
                    aggregate:
                      peakElo: 1566
                      bestStreak: 12
                      fastestWinMs: 861628
                      forfeitCount: 0
                    matches:
                      - id: 516492
                        matchType: competitive
                        gameMode: draftout
                        worldSeedMode: random
                        boardMode: random
                        usedCommands: false
                        outcome: forfeited
                        completedAt: 1789426891172
                        durationMs: 63264
                        participants:
                          - uuid: 5351a58a-3888-41a5-b128-7c090deba90e
                            username: Picklefish23350
                            won: false
                            score: 0
                            eloBefore: 1442
                            eloChange: -25
                            eloAfter: 1417
                            rd: 108.09685979882966
                          - uuid: 92b63a39-b36a-445f-a94c-77ae212dcea3
                            username: bing_pigs
                            won: true
                            score: 4
                            eloBefore: 1545
                            eloChange: 21
                            eloAfter: 1566
                            rd: 102.36122699299446
                    page: 1
                    totalPages: 1
                    filter: competitive
                    eraId: 2
                    eras:
                      - id: 1
                        firstMatchId: 0
                        season: null
                        system: elo
                      - id: 2
                        firstMatchId: 514840
                        season: null
                        system: glicko2
  /api/stats/{username}/{matchId}:
    get:
      tags:
        - Stats
      summary: Get a player's match detail
      description: |
        Returns player metadata and detailed match data for the requested match.
        If the match is not found for the player, the endpoint returns HTTP 200
        with `match: null`.
      operationId: getPlayerMatch
      parameters:
        - $ref: "#/components/parameters/Username"
        - name: matchId
          in: path
          required: true
          description: Numeric Draftout match ID.
          schema:
            type: integer
            example: 20010
      responses:
        "200":
          description: "Match detail or `match: null`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetailResponse"
  /api/stats/{username}/elo-series:
    get:
      tags:
        - Stats
      summary: Get a player's Elo history
      description: |
        Returns the player's starting Elo and one point per competitive match
        used to build an Elo chart.
      operationId: getPlayerEloSeries
      parameters:
        - $ref: "#/components/parameters/Username"
        - $ref: "#/components/parameters/Era"
      responses:
        "200":
          description: Elo series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EloSeriesResponse"
components:
  parameters:
    Username:
      name: username
      in: path
      required: true
      description: Minecraft username.
      schema:
        type: string
        example: Feinberg
    Era:
      name: era
      in: query
      description: |
        Positive rating-era ID. When omitted, the latest era is used. Available
        eras are returned in leaderboard and player-stat responses.
      required: false
      schema:
        type: integer
        minimum: 1
        example: 2
  schemas:
    MatchFilter:
      type: string
      description: |
        Match queue included in a player's record and match list:

        - `competitive`: ranked competitive matches.
        - `quick-play`: unranked quick-play matches.
        - `lobby`: custom lobby matches.
      enum:
        - competitive
        - quick-play
        - lobby
    Rank:
      type: object
      required:
        - name
        - min
        - max
        - color
      properties:
        name:
          type: string
          example: Guardian I
        min:
          type: integer
          minimum: 0
          description: Inclusive minimum rating for the band.
        max:
          type:
            - integer
            - "null"
          minimum: 0
          description: Maximum Elo for the band. `null` means no upper bound.
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#45686e"
    LeaderboardResponse:
      type: object
      required:
        - rows
        - metric
        - query
        - limit
        - eraId
        - eras
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardRow"
        metric:
          $ref: "#/components/schemas/LeaderboardMetric"
        query:
          type: string
          description: Normalized username query, or an empty string when omitted.
        limit:
          type: integer
          minimum: 1
        eraId:
          type: integer
          minimum: 1
        eras:
          type: array
          items:
            $ref: "#/components/schemas/Era"
    LeaderboardRow:
      type: object
      required:
        - uuid
        - username
        - elo
        - rd
        - eraId
        - rankName
        - rankColor
        - matches
        - completedMatches
        - wins
        - losses
        - draws
        - winRate
        - averageFinishTime
        - averageGoals
        - ranked
        - metricValue
        - rank
      properties:
        uuid:
          type: string
          format: uuid
        username:
          type: string
        elo:
          type: integer
        rd:
          type:
            - number
            - "null"
          description: Rating deviation. `null` for eras that use Elo ratings.
        eraId:
          type: integer
          minimum: 1
        rankName:
          type: string
        rankColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        matches:
          type: integer
          minimum: 0
        completedMatches:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        winRate:
          type: number
          minimum: 0
          maximum: 1
        averageFinishTime:
          type:
            - number
            - "null"
          description: Average finish time in milliseconds.
        averageGoals:
          type:
            - number
            - "null"
          description: Average goal differential for completed matches.
        ranked:
          type: boolean
        metricValue:
          type: number
          description: Value of the selected leaderboard metric.
        rank:
          type:
            - integer
            - "null"
          minimum: 1
          description: Position in the full metric leaderboard; may be `null` for a searched subset.
    LeaderboardMetric:
      type: string
      description: |
        Statistic used to order leaderboard rows:

        - `elo`: current rating (`elo`).
        - `winrate`: `wins / (wins + losses)`; draws are excluded.
        - `diff`: average goal differential across completed matches, exposed
          as `averageGoals` and calculated as player goals minus opponent goals.
      enum:
        - elo
        - winrate
        - diff
    Era:
      type: object
      required:
        - id
        - firstMatchId
        - season
        - system
      properties:
        id:
          type: integer
          minimum: 1
        firstMatchId:
          type: integer
          minimum: 0
          description: First match ID included in the era.
        season:
          type:
            - integer
            - "null"
          minimum: 1
        system:
          $ref: "#/components/schemas/RatingSystem"
    RatingSystem:
      type: string
      description: |
        Rating algorithm used by an era:

        - `elo`: the legacy Elo rating system; rating deviation is `null`.
        - `glicko2`: Glicko-2 ratings with rating deviation in `rd`.
      enum:
        - elo
        - glicko2
    PlayerStatsResponse:
      type: object
      required:
        - player
        - record
        - aggregate
        - matches
        - page
        - totalPages
        - filter
        - eraId
        - eras
      properties:
        player:
          anyOf:
            - $ref: "#/components/schemas/Player"
            - type: "null"
        record:
          $ref: "#/components/schemas/Record"
        aggregate:
          $ref: "#/components/schemas/Aggregate"
        matches:
          type: array
          items:
            $ref: "#/components/schemas/MatchSummary"
        page:
          type: integer
          minimum: 1
        totalPages:
          type: integer
          minimum: 1
        filter:
          $ref: "#/components/schemas/MatchFilter"
        eraId:
          type: integer
          minimum: 1
        eras:
          type: array
          items:
            $ref: "#/components/schemas/Era"
    MatchDetailResponse:
      type: object
      required:
        - player
        - match
      properties:
        player:
          anyOf:
            - $ref: "#/components/schemas/Player"
            - type: "null"
        match:
          anyOf:
            - $ref: "#/components/schemas/MatchDetail"
            - type: "null"
    EloSeriesResponse:
      type: object
      required:
        - startElo
        - points
        - eraId
      properties:
        startElo:
          type: integer
          example: 1259
        points:
          type: array
          items:
            $ref: "#/components/schemas/EloPoint"
        eraId:
          type: integer
          minimum: 1
    Player:
      type: object
      required:
        - uuid
        - username
        - elo
        - rd
        - ranked
        - rank
        - rankName
        - rankColor
        - eraId
      properties:
        uuid:
          type: string
          format: uuid
        username:
          type: string
        elo:
          type: integer
        rd:
          type:
            - number
            - "null"
          description: Rating deviation. `null` for eras that use Elo ratings.
        ranked:
          type: boolean
        rank:
          type:
            - integer
            - "null"
          minimum: 1
          description: Leaderboard rank. Observed as `null` for quick-play responses.
        rankName:
          type: string
          example: Guardian I
        rankColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#45686e"
        eraId:
          type: integer
          minimum: 1
    Record:
      type: object
      required:
        - matches
        - completedMatches
        - wins
        - losses
        - draws
        - winRate
        - averageFinishTime
        - averageGoals
      properties:
        matches:
          type: integer
          minimum: 0
        completedMatches:
          type: integer
          minimum: 0
        wins:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        draws:
          type: integer
          minimum: 0
        winRate:
          type: number
          minimum: 0
          maximum: 1
        averageFinishTime:
          type:
            - number
            - "null"
          description: Average finish time in milliseconds.
        averageGoals:
          type:
            - number
            - "null"
          description: Average goal differential for completed matches.
    Aggregate:
      type: object
      required:
        - peakElo
        - bestStreak
        - fastestWinMs
        - forfeitCount
      properties:
        peakElo:
          type:
            - integer
            - "null"
        bestStreak:
          type: integer
          minimum: 0
        fastestWinMs:
          type:
            - integer
            - "null"
          description: Fastest win duration in milliseconds.
        forfeitCount:
          type: integer
          minimum: 0
    MatchSummary:
      type: object
      required:
        - id
        - matchType
        - gameMode
        - worldSeedMode
        - boardMode
        - usedCommands
        - outcome
        - completedAt
        - durationMs
        - participants
      properties:
        id:
          type: integer
        matchType:
          $ref: "#/components/schemas/MatchType"
        gameMode:
          $ref: "#/components/schemas/GameMode"
        worldSeedMode:
          type: string
          description: World-seed selection mode. Observed as `random`.
          example: random
        boardMode:
          type: string
          description: Board selection mode. Observed as `random`.
          example: random
        usedCommands:
          type: boolean
          description: Whether commands were used during the match.
        outcome:
          $ref: "#/components/schemas/MatchOutcome"
        completedAt:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds.
        durationMs:
          type: integer
          description: Match duration in milliseconds.
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
    MatchDetail:
      allOf:
        - $ref: "#/components/schemas/MatchSummary"
        - type: object
          required:
            - seed
            - goals
            - draft
          properties:
            seed:
              type: string
              description: Minecraft world seed represented as a string.
            goals:
              type: array
              items:
                $ref: "#/components/schemas/Goal"
            draft:
              $ref: "#/components/schemas/Draft"
    Participant:
      type: object
      required:
        - uuid
        - username
        - won
        - score
        - eloBefore
        - eloChange
        - eloAfter
        - rd
      properties:
        uuid:
          type: string
          format: uuid
        username:
          type: string
        won:
          type: boolean
        score:
          type: integer
          minimum: 0
        eloBefore:
          type:
            - integer
            - "null"
        eloChange:
          type:
            - integer
            - "null"
        eloAfter:
          type:
            - integer
            - "null"
        rd:
          type:
            - number
            - "null"
          description: Rating deviation after the match. `null` for unranked participants or Elo eras.
    Goal:
      type: object
      required:
        - index
        - id
        - data
        - completed
        - completedByUuid
        - completedAtMs
      properties:
        index:
          type: integer
          minimum: 0
        id:
          type: string
          example: OBTAIN_64_COLORED_CONCRETE
        data:
          type:
            - string
            - "null"
          description: Goal-specific data, such as a color name.
        completed:
          type: boolean
        completedByUuid:
          type:
            - string
            - "null"
          format: uuid
        completedAtMs:
          type:
            - integer
            - "null"
          description: Milliseconds after match start when the goal was completed.
    Draft:
      type: object
      required:
        - pickedFirstUuid
        - pool
      properties:
        pickedFirstUuid:
          type:
            - string
            - "null"
          format: uuid
        pool:
          type: array
          items:
            $ref: "#/components/schemas/DraftPoolItem"
    DraftPoolItem:
      type: object
      required:
        - id
        - data
        - picked
        - timedOut
        - rerolled
      properties:
        id:
          type: string
        data:
          type:
            - string
            - "null"
        picked:
          type: boolean
        timedOut:
          type: boolean
        rerolled:
          type: boolean
          description: Whether this goal was replaced during the draft.
    EloPoint:
      type: object
      required:
        - matchId
        - completedAt
        - eloBefore
        - eloAfter
        - eloChange
        - outcome
        - won
        - opponentUuid
        - opponentName
        - playerScore
        - opponentScore
        - durationMs
      properties:
        matchId:
          type: integer
        completedAt:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds.
        eloBefore:
          type: integer
        eloAfter:
          type: integer
        eloChange:
          type: integer
        outcome:
          $ref: "#/components/schemas/MatchOutcome"
        won:
          type: boolean
        opponentUuid:
          type: string
          format: uuid
        opponentName:
          type: string
        playerScore:
          type: integer
          minimum: 0
        opponentScore:
          type: integer
          minimum: 0
        durationMs:
          type: integer
    MatchType:
      type: string
      description: |
        Queue in which the match was played:

        - `competitive`: ranked competitive queue.
        - `quick_play`: unranked quick-play queue.
        - `lobby`: custom lobby.
      enum:
        - competitive
        - quick_play
        - lobby
    MatchOutcome:
      type: string
      description: |
        Match result:

        - `finished`: completed normally.
        - `forfeited`: ended by a forfeit.
        - `draw_by_vote`: players voted to end the match as a draw.
        - `draw`: recorded as a draw.
        - `cancelled`: cancelled without a result.
      enum:
        - finished
        - forfeited
        - draw_by_vote
        - draw
        - cancelled
    GameMode:
      type: string
      description: |
        Board rules used by the match:

        - `draftout`: players draft the goals on the shared board.
        - `lockout`: players race on a randomly generated shared board.
        - `blackout`: players cooperate on one shared board.

        Competitive and quick-play matches use `draftout`; lobby matches may
        use any of the three modes.
      enum:
        - draftout
        - lockout
        - blackout
